version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: annapurna_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: annapurna_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna123
      POSTGRES_DB: annapurna_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/masters.sql:/docker-entrypoint-initdb.d/masters.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna -d annapurna_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  pg_data:
